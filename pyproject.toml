[project]
name = "air-quality-regression-deployment"
version = "0.1.0"
description = "PM2.5 regression model, FastAPI deployment, and Flutter mobile client"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi>=0.115,<1.0",
    "joblib>=1.4,<2.0",
    "matplotlib>=3.9,<4.0",
    "numpy>=2.0,<3.0",
    "pandas>=2.2,<3.0",
    "pydantic>=2.9,<3.0",
    "python-multipart>=0.0.12,<1.0",
    "scikit-learn>=1.5,<2.0",
    "uvicorn[standard]>=0.30,<1.0",
]

[dependency-groups]
dev = [
    "httpx>=0.27,<1.0",
    "ipykernel>=6.29,<7.0",
    "jupyterlab>=4.2,<5.0",
    "nbformat>=5.10,<6.0",
    "pytest>=8.3,<9.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
