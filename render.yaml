services:
  - type: web
    name: pm25-prediction-api
    runtime: python
    plan: free
    buildCommand: pip install uv && uv sync --no-dev
    startCommand: uv run uvicorn summative.API.prediction:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: ALLOWED_ORIGINS
        value: http://localhost:3000,http://localhost:5173,http://localhost:8080
      - key: RETRAIN_TOKEN
        generateValue: true
